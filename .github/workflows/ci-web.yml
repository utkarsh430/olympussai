name: CI - web app

# Lint/typecheck/test/build gate for the Next.js app (repo root), plus the
# live pilot-driver end-to-end suite. Required status check for merge into
# main/dev - see branch protection note in docs/CONTROL_SERVICE_DEPLOYMENT.md.

on:
  pull_request:
    branches: [main, dev]
    # `control-service/**` used to be ignored here, back when nothing in this
    # workflow touched it. The e2e job below builds, migrates and RUNS the
    # control service, so a control-service change can now break this
    # workflow - it has to be able to trigger it.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main, dev]

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # -----------------------------------------------------------------------
    # `pnpm test` used to run here with no database at all, so every
    # Postgres-backed test in the suite (src/tests/unit/*Db.test.ts - 12
    # tests across opsBreakdownReportsPaginationDb and
    # controlServiceWebhookDb) SKIPPED on every CI run and only ever
    # executed on an engineer's laptop. Those are the two files that prove
    # the guarantees living in SQL rather than in TypeScript - keyset
    # pagination not losing safety records, and ON CONFLICT dedupe - i.e.
    # exactly the regressions a mocked pool cannot catch. A suite that
    # reports green while skipping them proves nothing about them.
    #
    # Same image, credentials and health-check shape as the e2e job's own
    # ops-db below; this job needs no PostGIS service because nothing in
    # `pnpm test` talks to the control-service datastore (the webhook test
    # exercises THIS app's mirror tables, which live in the ops database).
    # -----------------------------------------------------------------------
    services:
      ops-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ops
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # Named secrets, checked once and up front. Without them the failure
      # arrives much later and disguised: a build that succeeds and produces
      # a /login page that cannot authenticate anybody, or a seed step
      # erroring on a Supabase call three jobs deep. Values are never
      # printed - only whether each one is set.
      - name: Check the Supabase secrets are configured
        run: |
          missing=""
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions:"
            echo "  NEXT_PUBLIC_SUPABASE_URL       the project URL, e.g. https://<ref>.supabase.co"
            echo "  NEXT_PUBLIC_SUPABASE_ANON_KEY  the project's anon/publishable key"
            exit 1
          fi
          echo "All required Supabase secrets are present."
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Throwaway fixtures in a container created and destroyed with the job,
      # so these credentials are local-only literals rather than secrets -
      # same reasoning as the e2e job's.
      - name: Apply ops migrations
        run: pnpm migrate:ops
        env:
          OPS_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/ops

      # OPS_DATABASE_URL is scoped to this step (and the migration above)
      # rather than the whole job on purpose: `pnpm build` below must keep
      # building with no database reachable, the way a real build machine
      # does.
      - name: Unit tests
        run: pnpm test
        env:
          OPS_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/ops

      - name: Build
        run: pnpm build
        env:
          # Build-time NEXT_PUBLIC_* values are inlined into the bundle.
          # Populate from repo secrets so a CI build catches the same
          # failures a real deploy would hit. Values live in GitHub repo
          # secrets (Settings > Secrets > Actions), mirrored from the
          # project's secrets vault - never hardcoded here.
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Supabase Auth is the single sign-in front door, and these two are
          # inlined into the browser bundle at build time - a build without
          # them produces a /login page that cannot authenticate anybody.
          # "Public" in the Supabase sense (the anon key is protected by RLS,
          # not by secrecy); they are kept as repo secrets anyway, following
          # this file's existing convention of never hardcoding project
          # identifiers. The service-role key is deliberately NOT here: this
          # job neither serves requests nor provisions accounts.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ---------------------------------------------------------------------------
  # tests/e2e/pilot-driver-command.spec.ts AND
  # tests/e2e/control-room-command-delivery.spec.ts, actually running.
  #
  # Between them these are the only tests in the repo that exercise the whole
  # control-service -> driver-console -> ack -> both-audit-logs loop (the
  # first) and the REAL create -> deliver product path, dispatcher approval
  # through to the driver console, with no REST client of its own that could
  # reach for /deliver directly (the second — see its file header for the
  # incident that convention prevents). Both skipped themselves on every run
  # this repo has ever done, because their E2E_* variables were never set
  # anywhere. A suite that only ever skips is worth nothing, so this job
  # provisions the real thing: the two datastores both specs' headers list,
  # both migration runners, a seeded pilot_driver/dispatcher/control_room,
  # and both processes. Both specs hard-FAIL (never skip) when CI=true and a
  # variable is missing, so this can never silently regress back to skipping.
  #
  # Neither database holds anything but throwaway fixtures - the containers
  # are created and destroyed with the job, and the credentials below are
  # local-only, which is why they are literals rather than secrets.
  # ---------------------------------------------------------------------------
  e2e-pilot-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # Control service's own datastore. PostGIS, not plain Postgres: its
      # first migration does `create extension postgis` and its route
      # geometry columns are `geography` types.
      control-service-db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_service
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # This app's own ops datastore (db/migrations, OPS_DATABASE_URL).
      # Deliberately a SEPARATE container from the one above: the two
      # datastores are isolated by design (docs/CONTROL_SERVICE_INTEGRATION.md
      # section 3), and sharing one here would let a cross-datastore query
      # pass in CI that cannot work in production.
      ops-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ops
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CONTROL_SERVICE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/control_service
      OPS_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/ops
      # One shared value on both ends of the web -> control-service bearer
      # check, and one on both ends of the webhook HMAC. Mismatching either
      # is the single most common way this integration silently breaks, so
      # they are defined once here and referenced everywhere below.
      SERVICE_TOKEN: ci-e2e-service-token-not-a-real-secret
      WEBHOOK_SECRET: ci-e2e-webhook-hmac-not-a-real-secret
      OPS_SESSION_SECRET: ci-e2e-ops-session-secret-at-least-32-characters

      # -------------------------------------------------------------------
      # SUPABASE. The three ops suites now sign in at /login, the single
      # front door, instead of at the legacy password endpoint - which is
      # what makes that endpoint deletable at all, since it was the only ops
      # coverage this repo had and it all depended on the old door.
      #
      # This runs against the project's REAL Supabase directory. There is no
      # second one, and a fake would prove nothing about the claim
      # verification, the Edge ceiling or the landing decision the product
      # actually uses. The anon key is public by design (RLS is what
      # protects it); the service-role key bypasses RLS and is what
      # provisions the QA sign-in identities below. Next inlines only
      # NEXT_PUBLIC_* into the browser bundle, so the service-role key stays
      # server-side even though it is set job-wide here (as OPS_DATABASE_URL
      # already is for this job).
      #
      # THE SAFETY RULE, enforced in code rather than by convention:
      # scripts/lib/qa-identity.mjs refuses to create, change or delete any
      # identity outside *.qa@example.test, and the teardown step below takes
      # no address at all - it lists the directory and filters. Read that
      # module before touching any of this.
      # -------------------------------------------------------------------
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Every QA identity this run creates carries this token in its local
      # part, and the teardown removes only identities carrying it.
      #
      # RUN-SCOPED, NOT FIXED, and that is not tidiness. Two pull requests
      # can reach this job at the same time (`concurrency` above is keyed on
      # the ref, so it serialises a branch with itself and nothing else)
      # against one shared Supabase directory. With one fixed address per
      # role, the second run's account creation collides with the first's,
      # and the first run's teardown deletes the second run's accounts
      # mid-suite - a green change goes red for reasons that have nothing to
      # do with it.
      QA_IDENTITY_SCOPE: ci-${{ github.run_id }}-${{ github.run_attempt }}

      PILOT_DRIVER_EMAIL: pilot-driver.ci-${{ github.run_id }}-${{ github.run_attempt }}.qa@example.test
      PILOT_DRIVER_PASSWORD: ci-e2e-pilot-driver-password
      # control-room-command-delivery.spec.ts's own two roles: a dispatcher
      # to record the human approval and a control_room account to issue the
      # command through it — the two decisions a real dispatch requires that
      # the pilot-driver spec's fixtures never needed.
      DISPATCHER_EMAIL: dispatcher.ci-${{ github.run_id }}-${{ github.run_attempt }}.qa@example.test
      DISPATCHER_PASSWORD: ci-e2e-dispatcher-password
      CONTROL_ROOM_EMAIL: control-room.ci-${{ github.run_id }}-${{ github.run_attempt }}.qa@example.test
      CONTROL_ROOM_PASSWORD: ci-e2e-control-room-password
      # tests/e2e/ops-dashboard-pages.spec.ts covers all twelve ops
      # dashboards, so it needs the remaining four roles too. Before it, only
      # /ops/pilot-driver had any end-to-end coverage at all, which is how a
      # defect living in the shape shared by all twelve pages shipped green.
      ADMIN_EMAIL: admin.ci-${{ github.run_id }}-${{ github.run_attempt }}.qa@example.test
      ADMIN_PASSWORD: ci-e2e-admin-password
      DRIVER_EMAIL: driver.ci-${{ github.run_id }}-${{ github.run_attempt }}.qa@example.test
      DRIVER_PASSWORD: ci-e2e-driver-password
      DEPOT_EMAIL: depot.ci-${{ github.run_id }}-${{ github.run_attempt }}.qa@example.test
      DEPOT_PASSWORD: ci-e2e-depot-password
      PLANNER_EMAIL: planner.ci-${{ github.run_id }}-${{ github.run_attempt }}.qa@example.test
      PLANNER_PASSWORD: ci-e2e-planner-password

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # Named secrets, checked once and up front. Without them the failure
      # arrives much later and disguised: a build that succeeds and produces
      # a /login page that cannot authenticate anybody, or a seed step
      # erroring on a Supabase call three jobs deep. Values are never
      # printed - only whether each one is set.
      - name: Check the Supabase secrets are configured
        run: |
          missing=""
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions:"
            echo "  NEXT_PUBLIC_SUPABASE_URL       the project URL, e.g. https://<ref>.supabase.co"
            echo "  NEXT_PUBLIC_SUPABASE_ANON_KEY  the project's anon/publishable key"
            echo "  SUPABASE_SERVICE_ROLE_KEY      the project's service_role key (bypasses RLS - keep it secret)"
            exit 1
          fi
          echo "All required Supabase secrets are present."


      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install control-service dependencies
        run: pnpm install --frozen-lockfile
        working-directory: control-service

      # Only the browser this suite's single project uses. --with-deps pulls
      # the shared libraries headless Chromium needs on a bare ubuntu runner.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # --- schema -------------------------------------------------------
      - name: Apply ops migrations
        run: pnpm migrate:ops

      - name: Apply control-service migrations
        run: pnpm migrate
        working-directory: control-service
        env:
          SERVICE_TOKEN_SECRET: ${{ env.SERVICE_TOKEN }}
          WEBHOOK_HMAC_SECRET: ${{ env.WEBHOOK_SECRET }}

      # --- fixtures -----------------------------------------------------
      # The seven accounts these three specs log in as.
      # scripts/seed-ops-admin.mjs seeds an admin and nothing else; every
      # other ops account normally comes from an admin invite, which needs a
      # mailbox and an admin session CI has neither of - hence
      # scripts/seed-ops-user.mjs. Each spec seeds its own per-test
      # control-service fixtures (vehicle, approval, rollout stage) directly,
      # as their headers explain.
      #
      # With SUPABASE_SERVICE_ROLE_KEY set, both scripts ALSO provision the
      # Supabase Auth identity each row signs in with, stamp its
      # app_metadata.ops_role claim, and link it via
      # ops_users.supabase_user_id. Without all three of those the account
      # exists in Postgres and cannot get past the Edge ceiling, so /login
      # would answer a correct password with an explanation page. Both
      # scripts REFUSE to provision an identity for anything outside
      # *.qa@example.test.
      - name: Seed the pilot_driver account
        run: >-
          node scripts/seed-ops-user.mjs
          --email "$PILOT_DRIVER_EMAIL"
          --name "CI Pilot Driver"
          --role pilot_driver
        env:
          OPS_SEED_PASSWORD: ${{ env.PILOT_DRIVER_PASSWORD }}

      - name: Seed the dispatcher account
        run: >-
          node scripts/seed-ops-user.mjs
          --email "$DISPATCHER_EMAIL"
          --name "CI Dispatcher"
          --role dispatcher
        env:
          OPS_SEED_PASSWORD: ${{ env.DISPATCHER_PASSWORD }}

      - name: Seed the control_room account
        run: >-
          node scripts/seed-ops-user.mjs
          --email "$CONTROL_ROOM_EMAIL"
          --name "CI Control Room"
          --role control_room
        env:
          OPS_SEED_PASSWORD: ${{ env.CONTROL_ROOM_PASSWORD }}

      # The remaining three non-admin roles, for ops-dashboard-pages.spec.ts.
      - name: Seed the driver account
        run: >-
          node scripts/seed-ops-user.mjs
          --email "$DRIVER_EMAIL"
          --name "CI Driver"
          --role driver
        env:
          OPS_SEED_PASSWORD: ${{ env.DRIVER_PASSWORD }}

      - name: Seed the depot account
        run: >-
          node scripts/seed-ops-user.mjs
          --email "$DEPOT_EMAIL"
          --name "CI Depot"
          --role depot
        env:
          OPS_SEED_PASSWORD: ${{ env.DEPOT_PASSWORD }}

      - name: Seed the planner account
        run: >-
          node scripts/seed-ops-user.mjs
          --email "$PLANNER_EMAIL"
          --name "CI Planner"
          --role planner
        env:
          OPS_SEED_PASSWORD: ${{ env.PLANNER_PASSWORD }}

      # The admin, which seed-ops-user.mjs deliberately refuses to create (it
      # must never be able to mint privilege). seed-ops-admin.mjs is the only
      # supported path for the first admin, and it reads the password from
      # stdin rather than argv so it never lands in shell history or `ps` -
      # hence the pipe rather than an OPS_SEED_PASSWORD env var. The trailing
      # newline is required: it is what makes readline deliver the line.
      - name: Seed the admin account
        run: >-
          printf '%s\n' "$ADMIN_PASSWORD" |
          node scripts/seed-ops-admin.mjs
          --email "$ADMIN_EMAIL"
          --name "CI Admin"

      # --- services -----------------------------------------------------
      - name: Build control-service
        run: pnpm build
        working-directory: control-service

      - name: Start control-service
        working-directory: control-service
        env:
          NODE_ENV: test
          PORT: "8081"
          SERVICE_TOKEN_SECRET: ${{ env.SERVICE_TOKEN }}
          WEBHOOK_HMAC_SECRET: ${{ env.WEBHOOK_SECRET }}
          WEB_APP_WEBHOOK_URL: http://127.0.0.1:3000/api/control-service/webhook
          # Test 4 asserts the PERIODIC backstop sweep expires a 5s-TTL
          # command within 30s. At the 30s default that is a coin flip on
          # timer alignment; 5s makes it deterministic without changing what
          # is being tested (that the timer runs at all).
          COMMAND_TTL_SWEEP_INTERVAL_MS: "5000"
          # No network geometry is seeded here (the spec never ingests a GPS
          # fix), so /readyz must not gate on it. Liveness is what the wait
          # loop below checks.
          REQUIRE_SEEDED_NETWORK: "false"
          # Never poll the real UPSRTC feed from CI.
          GPS_POLL_ENABLED: "false"
        run: |
          node dist/index.js > "$RUNNER_TEMP/control-service.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/control-service.pid"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/healthz > /dev/null; then
              echo "control-service is up"; exit 0
            fi
            sleep 1
          done
          echo "control-service did not become healthy"; cat "$RUNNER_TEMP/control-service.log"; exit 1

      - name: Build web app
        run: pnpm build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Start web app
        env:
          PORT: "3000"
          CONTROL_SERVICE_BASE_URL: http://127.0.0.1:8081
          CONTROL_SERVICE_SERVICE_TOKEN: ${{ env.SERVICE_TOKEN }}
          CONTROL_SERVICE_WEBHOOK_SECRET: ${{ env.WEBHOOK_SECRET }}
        run: |
          pnpm start > "$RUNNER_TEMP/web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web.pid"
          # Wait for a real 200 from a real page, not just an open socket:
          # playwright.config.ts reuses an existing server only when its URL
          # answers successfully, and a half-started Next would otherwise make
          # Playwright try to start a second one on the same port.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ops/login > /dev/null; then
              echo "web app is up"; exit 0
            fi
            sleep 2
          done
          echo "web app did not become ready"; cat "$RUNNER_TEMP/web.log"; exit 1

      # --- the actual suites ---------------------------------------------
      - name: Pilot-driver command + control-room command delivery + ops dashboards e2e
        env:
          # CI=true is what turns "a variable is unset" from a silent skip
          # into a hard failure inside either spec.
          CI: "true"
          E2E_ORIGIN: http://127.0.0.1:3000
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_PILOT_DRIVER_EMAIL: ${{ env.PILOT_DRIVER_EMAIL }}
          E2E_PILOT_DRIVER_PASSWORD: ${{ env.PILOT_DRIVER_PASSWORD }}
          E2E_DISPATCHER_EMAIL: ${{ env.DISPATCHER_EMAIL }}
          E2E_DISPATCHER_PASSWORD: ${{ env.DISPATCHER_PASSWORD }}
          E2E_CONTROL_ROOM_EMAIL: ${{ env.CONTROL_ROOM_EMAIL }}
          E2E_CONTROL_ROOM_PASSWORD: ${{ env.CONTROL_ROOM_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          E2E_DRIVER_EMAIL: ${{ env.DRIVER_EMAIL }}
          E2E_DRIVER_PASSWORD: ${{ env.DRIVER_PASSWORD }}
          E2E_DEPOT_EMAIL: ${{ env.DEPOT_EMAIL }}
          E2E_DEPOT_PASSWORD: ${{ env.DEPOT_PASSWORD }}
          E2E_PLANNER_EMAIL: ${{ env.PLANNER_EMAIL }}
          E2E_PLANNER_PASSWORD: ${{ env.PLANNER_PASSWORD }}
          E2E_CONTROL_SERVICE_URL: http://127.0.0.1:8081
          E2E_CONTROL_SERVICE_TOKEN: ${{ env.SERVICE_TOKEN }}
          E2E_CONTROL_SERVICE_DATABASE_URL: ${{ env.CONTROL_SERVICE_DATABASE_URL }}
          E2E_OPS_DATABASE_URL: ${{ env.OPS_DATABASE_URL }}
        # Explicit filenames, not the whole tests/e2e/ directory: this job
        # only provisions what these specs need. Other e2e specs (e.g.
        # command-centre.spec.ts, gated on E2E_PROJECT_PIN) merely skip
        # locally when their own vars are unset — they don't have the
        # CI=true hard-fail guard these do — but running them here would
        # still mean standing up infrastructure this job was never meant to
        # own.
        run: >-
          pnpm test:e2e
          pilot-driver-command
          control-room-command-delivery
          ops-dashboard-pages

      - name: Service logs (on failure)
        if: failure()
        run: |
          echo "===== control-service ====="; tail -n 200 "$RUNNER_TEMP/control-service.log" || true
          echo "===== web app ====="; tail -n 200 "$RUNNER_TEMP/web.log" || true

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          for pidfile in "$RUNNER_TEMP/web.pid" "$RUNNER_TEMP/control-service.pid"; do
            [ -f "$pidfile" ] && kill "$(cat "$pidfile")" 2>/dev/null || true
          done

      # -------------------------------------------------------------------
      # Remove this run's QA sign-in identities from the shared Supabase
      # directory, and VERIFY they are gone.
      #
      # `if: always()` because the accounts outlive a failed suite: the two
      # databases are containers that vanish with the job, but Supabase is
      # not, and identities left behind accumulate forever and eventually
      # collide with a later run.
      #
      # It cannot touch anything outside *.qa@example.test. The step passes
      # no address; scripts/qa-identity-teardown.mjs lists the directory,
      # keeps only the namespace, re-checks each record immediately before
      # deleting it, and then re-reads the directory to confirm. It exits
      # non-zero if anything it tried to remove is still there - a teardown
      # that reports success while leaving accounts behind is worse than one
      # that fails, because the collision surfaces three jobs away.
      #
      # It also sweeps namespace identities older than its stale threshold,
      # which is what cleans up after runs `cancel-in-progress` killed before
      # their own teardown could run.
      # -------------------------------------------------------------------
      - name: Remove this run's QA sign-in identities
        if: always()
        run: node scripts/qa-identity-teardown.mjs
