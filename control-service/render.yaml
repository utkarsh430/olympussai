# Render Blueprint for the control service (route-direction state/MPC
# service). See docs/CONTROL_SERVICE_DEPLOYMENT.md for the full plan this
# implements and control-service/README.md for the service's scope.
#
# STATUS: application scaffold now exists (control-service/Dockerfile,
# package.json, /healthz + /readyz handlers - see control-service/README.md
# "Application runtime"). This blueprint is still not connected to a
# Render account/team - there is no live infra behind it yet. Connecting
# it, setting the `sync: false` secrets below, and pushing to dev/main is
# the remaining step; see docs/CONTROL_SERVICE_DEPLOYMENT.md "Blocker".
#
# Two independently-deployable environments, per the ticket's "separate
# staging/pilot envs" requirement:
#   - control-service-staging tracks the `dev` branch, auto-deploys on
#     every merge.
#   - control-service-pilot tracks the `main` branch, auto-deploys on
#     merge (promote staging -> main via PR, same as the web app).
# Each environment gets its own Postgres/PostGIS instance - no data
# sharing between staging and pilot, matching the "own datastore per
# service" rule in docs/CONTROL_SERVICE_INTEGRATION.md section 3.
#
# MIGRATIONS: both services run `preDeployCommand` before the new version
# takes traffic, so the schema is never behind the code that queries it.
# Render runs it once per deploy (not once per instance), and the runner
# additionally takes a pg advisory lock, so the two pilot instances cannot
# race even if that ever changes.
#
# Why `node dist/db/migrate.js` and not `pnpm migrate`: the runtime image
# (./Dockerfile) is a multi-stage build whose final stage ships only dist/
# plus PRODUCTION node_modules, and never runs `corepack enable`. `tsx` is a
# devDependency, so it is absent there, and pnpm itself is not on PATH -
# `pnpm migrate` would fail at deploy time. src/db/migrate.ts is inside
# tsconfig.build.json's `include`, so it compiles to dist/db/migrate.js as
# part of the normal build with no extra step. `pnpm migrate` still exists
# in package.json for local use, where devDependencies are present.

services:
  - type: web
    name: control-service-staging
    runtime: docker
    dockerfilePath: ./control-service/Dockerfile
    dockerContext: ./control-service
    plan: starter
    region: singapore
    branch: dev
    autoDeploy: true
    healthCheckPath: /healthz
    preDeployCommand: node dist/db/migrate.js
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: staging
      - key: CONTROL_SERVICE_DATABASE_URL
        fromDatabase:
          name: control-service-db-staging
          property: connectionString
      - key: SERVICE_TOKEN_SECRET
        sync: false # set via `render env set`, see docs/CONTROL_SERVICE_DEPLOYMENT.md
      - key: WEBHOOK_HMAC_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging

  - type: web
    name: control-service-pilot
    runtime: docker
    dockerfilePath: ./control-service/Dockerfile
    dockerContext: ./control-service
    plan: standard
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    preDeployCommand: node dist/db/migrate.js
    numInstances: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONTROL_SERVICE_DATABASE_URL
        fromDatabase:
          name: control-service-db-pilot
          property: connectionString
      - key: SERVICE_TOKEN_SECRET
        sync: false
      - key: WEBHOOK_HMAC_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: pilot

databases:
  - name: control-service-db-staging
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"

  - name: control-service-db-pilot
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "16"
